<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: artifact:; frame-src artifact:; font-src 'self' data:; form-action 'none'; base-uri 'none'" />
  <title>Claude Panel</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="drag"></div>
      <div class="brand">
        <span class="brand-mark">✳</span>
        <span>Claude Panel</span>
      </div>
      <nav id="nav">
        <button class="nav-item" id="navNew" title="Yeni sohbet (⌘N)">
          <span class="nav-ic" data-icon="plus"></span><span>Yeni sohbet</span><kbd>⌘N</kbd>
        </button>
        <button class="nav-item" id="navArtifacts" title="Artifacts (⇧⌘A)">
          <span class="nav-ic" data-icon="artifacts"></span><span>Artifacts</span><span class="nav-count" id="artCount"></span>
        </button>
      </nav>
      <div class="section-label">Hesaplar</div>
      <div id="accounts"></div>
      <div class="sidebar-footer">
        <button id="settingsBtn" class="nav-item" title="Hesap ayarları (⌘,)">
          <span class="nav-ic" data-icon="settings"></span><span>Hesap ayarları</span><kbd>⌘,</kbd>
        </button>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <div class="acct-title">
          <span class="dot" id="topDot"></span>
          <span id="topName"></span>
          <span class="muted" id="topNote"></span>
        </div>
        <div class="seg" id="viewSeg">
          <button data-view="code" title="Claude Code bu Mac'te çalışır (⌘K ile geç)"><span data-icon="terminal"></span>Yerel Code</button>
          <button data-view="chat" title="claude.ai web: sohbet ve bulut oturumları (⌘K ile geç)"><span data-icon="globe"></span>Web</button>
        </div>
      </header>
      <section id="stage">
        <div id="artifactsPage"></div>
      </section>
    </main>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2>Hesap ayarları</h2>
        <button class="icon-btn" id="modalClose" title="Kapat">✕</button>
      </div>
      <p class="muted small">
        Her hesabın kendi <b>ayar klasörü</b> var; Claude Code girişi ve geçmişi orada tutulur.
        Bir hesabın klasörünü boş bırakırsanız varsayılan <code>~/.claude</code> kullanılır
        (yani şu an terminalde açık olan hesabınız). Chat oturumları her hesap için ayrıca saklanır.
      </p>
      <div id="acctForm"></div>
      <div class="modal-actions">
        <button class="ghost-btn" id="addAcct">+ Hesap ekle</button>
        <span class="spacer"></span>
        <button class="ghost-btn" id="modalCancel">Vazgeç</button>
        <button class="primary-btn" id="modalSave">Kaydet</button>
      </div>
    </div>
  </div>

  <div id="toast" hidden></div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../node_modules/marked/lib/marked.umd.js"></script>
  <script src="../node_modules/dompurify/dist/purify.js"></script>
  <script src="icons.js"></script>
  <script src="chat.js"></script>
  <script src="artifacts.js"></script>
  <script src="usage.js"></script>
  <script src="app.js"></script>
</body>
</html>
