<!doctype html><html><head><meta charset="utf-8"><title>Octopus taslak</title>
<style>:root{color-scheme:dark;--text:#eeece5;--soft:#d3d0c7;--muted:#a19e95;--faint:#6f6c65;--clay:#d97757;--accent:#d97757;--bg:#252422;--bg-2:#1f1e1c;--bg-3:#2e2d2a;--line:rgba(236,230,214,.13);--line-soft:rgba(236,230,214,.075);--danger:#e5645a;--warn:#e2b86b;--ok:#8fbf7f;--ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;--mono:"SF Mono",Menlo,monospace}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--ui)}body{padding:14px;width:700px}</style></head><body>
<style>
.oc{font:14px/1.45 var(--ui);color:var(--text);-webkit-user-select:none;user-select:none}
.oc-top{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.oc-name{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-name b{color:var(--text);font-weight:600;letter-spacing:.06em}
.oc-tag{font:10.5px var(--mono);color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-left:8px}
.oc button{font:12px/1 var(--ui);color:var(--text);background:var(--bg-3);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.oc button:hover:not(:disabled){border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.oc button:disabled{opacity:.38;cursor:default}
.oc button.pri{background:color-mix(in srgb,var(--accent) 24%,var(--bg-3));border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.oc svg{display:block;width:100%;height:auto}
.oc svg text{font-family:var(--ui)}
.oc-info{display:flex;gap:10px;align-items:flex-start;min-height:66px;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--bg-2) 80%,transparent)}
.oc-info .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.oc-info .tx{flex:1;min-width:0}
.oc-info .t{font-size:13px;font-weight:600}
.oc-info .d{font-size:12.5px;color:var(--muted);margin-top:1px}
.oc-info .m{font:11px/1.4 var(--mono);color:var(--faint);margin-top:4px}
.oc-info button{align-self:center;flex:none}
.oc .hit,.oc .lbl,.oc .head{cursor:pointer}
.oc .lbl .n{font-size:12px;font-weight:600}
.oc .lbl .s{font-size:10.5px}
.oc.dense .lbl .n{font-size:11px}
.oc .lbl:not(.on) text{paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
</style>
<div class="oc" id="oc">
  <div class="oc-top">
    <div class="oc-name"><b>OCTOPUS</b> · Imladris projesini oyunlaştırma<span class="oc-tag">taslak</span></div>
    <button id="oc-grow">+ Yeni kol</button>
    <button id="oc-cut" disabled>Kolu kes</button>
    <button id="oc-ink">Beyni sıkıştır</button>
  </div>
  <svg id="oc-sv" viewBox="0 0 700 468" role="img" aria-label="Octopus: baş ana oturum, her kol bir yan oturum"></svg>
  <div class="oc-info" id="oc-info"></div>
</div>
<script>
(() => {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
const root = $('oc'), sv = $('oc-sv'), info = $('oc-info');
const bGrow = $('oc-grow'), bCut = $('oc-cut'), bInk = $('oc-ink');
const css = getComputedStyle(document.documentElement);
const cv = (n, f) => css.getPropertyValue(n).trim() || f;
const COL = {
  accent: cv('--accent', '#d97757'), ok: cv('--ok', '#8fbf7f'), warn: cv('--warn', '#e2b86b'), danger: cv('--danger', '#e5645a'),
  text: cv('--text', '#eeece5'), muted: cv('--muted', '#a19e95'), faint: cv('--faint', '#6f6c65'),
  bg3: cv('--bg-3', '#2e2d2a'), line: cv('--line', 'rgba(236,230,214,.13)'),
};
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const W = 700, H = 468, HX = 350, N = 48, MAX_ARMS = 8;
const el = (tag, at, parent) => {
  const e = document.createElementNS(NS, tag);
  if (at) for (const k in at) e.setAttribute(k, at[k]);
  if (parent) parent.appendChild(e);
  return e;
};
const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (k) => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
const back = (k) => { k = clamp(k, 0, 1); const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const f1 = (v) => Math.round(v * 10) / 10;
const op = (v) => Math.round(clamp(v, 0, 1) * 100) / 100;

// ---- tanımlar ve katmanlar
const defs = el('defs', null, sv);
function grad(tag, id, at, stops) {
  const g = el(tag, Object.assign({ id }, at), defs);
  for (const [o, c, o2] of stops) el('stop', { offset: o, 'stop-color': c, 'stop-opacity': o2 == null ? 1 : o2 }, g);
  return g;
}
grad('radialGradient', 'oc-head', { cx: '40%', cy: '28%', r: '80%' }, [[0, '#f2b297'], [0.5, COL.accent], [1, '#7c3b27']]);
grad('radialGradient', 'oc-bg', { cx: '50%', cy: '24%', r: '60%' }, [[0, COL.accent, 0.14], [1, COL.accent, 0]]);
function blur(id, sd) {
  const f = el('filter', { id, x: '-80%', y: '-80%', width: '260%', height: '260%' }, defs);
  el('feGaussianBlur', { stdDeviation: sd }, f);
}
blur('oc-b4', 4); blur('oc-b6', 6); blur('oc-b12', 12);
const MANTLE = 'M350 24C398 24 421 60 419 104C417 140 400 160 396 176C380 190 320 190 304 176C300 160 283 140 281 104C279 60 302 24 350 24Z';
el('path', { d: MANTLE }, el('clipPath', { id: 'oc-clip' }, defs));

el('rect', { x: 0, y: 0, width: W, height: H, fill: 'url(#oc-bg)' }, sv);
const gPlank = el('g', null, sv);
const gDebris = el('g', null, sv);
const gArms = el('g', null, sv);
const gPulse = el('g', null, sv);
const gHead = el('g', { class: 'head' }, sv);
const gInk = el('g', { filter: 'url(#oc-b6)' }, sv);
const gFx = el('g', null, sv);
const gLbl = el('g', null, sv);

// ---- baş (beyin)
const halo = el('ellipse', { cx: HX, cy: 104, rx: 96, ry: 100, fill: COL.accent, opacity: 0.12, filter: 'url(#oc-b12)' }, gHead);
el('path', { d: MANTLE, fill: 'url(#oc-head)' }, gHead);
const gFill = el('g', { 'clip-path': 'url(#oc-clip)' }, gHead);
const fillP = el('path', { fill: '#ffe4d6', opacity: 0.2 }, gFill);
const fillL = el('path', { fill: 'none', stroke: '#fff2ea', 'stroke-width': 1.2, opacity: 0.5 }, gFill);
const tint = el('path', { d: MANTLE, fill: COL.warn, opacity: 0 }, gHead);
el('ellipse', { cx: 323, cy: 60, rx: 22, ry: 11, fill: '#fff', opacity: 0.11, transform: 'rotate(-30 323 60)' }, gHead);
for (const [x, y, r] of [[373, 54, 3], [393, 88, 2.4], [308, 102, 2.1], [366, 122, 2.2], [338, 40, 1.7], [399, 130, 1.8], [300, 134, 1.6]])
  el('ellipse', { cx: x, cy: y, rx: r, ry: r * 0.8, fill: '#7c3b27', opacity: 0.4 }, gHead);
const ring = el('path', { d: MANTLE, fill: 'none', stroke: COL.text, 'stroke-width': 1.2, opacity: 0 }, gHead);
const tBrain = el('text', { x: HX, y: 74, 'text-anchor': 'middle', fill: '#fff4ec', 'font-size': 9.5, 'font-weight': 600, 'letter-spacing': 2, opacity: 0.8 }, gHead);
tBrain.textContent = 'BEYİN';
const tCtx = el('text', { x: HX, y: 100, 'text-anchor': 'middle', fill: '#fff6f0', 'font-size': 19, 'font-weight': 600 }, gHead);
const tCtxL = el('text', { x: HX, y: 115, 'text-anchor': 'middle', fill: '#fff4ec', 'font-size': 9.5, opacity: 0.75 }, gHead);
tCtxL.textContent = 'bağlam dolu';
const eyes = [326, 374].map((x) => {
  const g = el('g', null, gHead);
  el('ellipse', { cx: x, cy: 151, rx: 13.5, ry: 11.5, fill: '#7c3b27', opacity: 0.4 }, g);
  const lid = el('g', null, g);
  el('ellipse', { cx: x, cy: 150, rx: 9.5, ry: 7.6, fill: '#f5ebdf', stroke: '#6a3020', 'stroke-width': 1.1 }, lid);
  const pupil = el('rect', { x: x - 4.6, y: 148.4, width: 9.2, height: 3.2, rx: 1.6, fill: '#1b1917' }, lid);
  return { x, y: 150, lid, pupil, px: 0, py: 0 };
});
gHead.addEventListener('click', (e) => { e.stopPropagation(); select('head'); });
sv.addEventListener('click', () => select('head'));

// ---- deniz tozu
const plank = Array.from({ length: 22 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: 0.6 + Math.random() * 1.3, sp: 3 + Math.random() * 7, o: 0.06 + Math.random() * 0.16, ph: Math.random() * 6.28 }));
for (const p of plank) p.el = el('circle', { r: p.r, fill: COL.text, opacity: p.o }, gPlank);

// ---- kollar
const MOTION = {
  'çalışıyor':    { amp: 8, freq: 0.55, k: 1.25, curl: 0.5, lift: 0 },
  'bekliyor':     { amp: 4, freq: 0.3,  k: 0.9,  curl: 1.6, lift: 1 },
  'rapor':        { amp: 6, freq: 0.45, k: 1.1,  curl: 0.8, lift: 0 },
  'doğrulanıyor': { amp: 4, freq: 0.3,  k: 1,    curl: 1.4, lift: 0 },
  'bitti':        { amp: 3, freq: 0.16, k: 0.8,  curl: 2.5, lift: 0 },
  'büyüyor':      { amp: 5, freq: 0.5,  k: 1.2,  curl: 0.4, lift: 0 },
  'öneri':        { amp: 2, freq: 0.15, k: 0.8,  curl: 0.2, lift: 0 },
  'kesildi':      { amp: 0, freq: 0,    k: 1,    curl: 0,   lift: 0 },
};
const STOPS = {
  base: ['#a14f36', COL.accent, '#efa98d'],
  rest: ['#8b4531', '#bf6a4e', '#d99b82'],
  wait: ['#a14f36', '#e39a60', '#f3cd82'],
};
const STATE_NAME = { 'çalışıyor': 'çalışıyor', 'bekliyor': 'seni bekliyor', 'rapor': 'beyne rapor veriyor', 'doğrulanıyor': 'beyin doğruluyor', 'bitti': 'bitti', 'büyüyor': 'büyüyor', 'öneri': 'beyin öneriyor', 'kesildi': 'kesildi' };
const STATE_COL = { 'çalışıyor': COL.accent, 'bekliyor': COL.warn, 'bitti': COL.ok, 'öneri': COL.faint, 'kesildi': COL.danger };

const ARMS0 = [
  { short: 'Faz 1 · Yönetmen', full: 'Faz 1: Yönetmen, Hakem ve oynanabilir akış', state: 'bitti', done: 6, total: 6, turns: 9,
    last: 'Smoke 14/14 geçti, gerçek konuşma turu dahil. Beyin doğruladı.' },
  { short: 'Faz 2 · Dövüş', full: 'Dövüş prototipi (Faz 2, arena)', state: 'bitti', done: 5, total: 5, turns: 7,
    last: 'Arena kontrolü hatasız. Dövüş hissi henüz elle denenmedi.' },
  { short: 'Faz 3 · Kadro', full: 'Faz 3: Kadro (yeni konuşan karakterler)', state: 'bitti', done: 4, total: 4, turns: 5,
    last: 'Konuşan karakterler eklendi, tür denetimi temiz.' },
  { short: 'Faz 4 · Düşmanlar', full: 'Faz 4: Düşmanlar (modeller ve yapay zekâ)', state: 'bitti', done: 5, total: 5, turns: 6,
    last: 'Modeller ve davranışlar bağlandı, smoke 23/23.' },
  { short: 'Faz 5 · Dünya', full: 'Faz 5: Dünya (mekânlar, izler, ara sahneler)', state: 'çalışıyor', done: 2, total: 7, turns: 3, branch: 'panel/faz-5-dunya',
    last: 'Modül klasörleri listeleniyor, Colliders okunuyor',
    acts: ['world/isikIzleri.ts düzenlendi', 'ara-sahneler/konuk-evi.json yazıldı', 'world/uykuOdasi.ts düzenlendi', 'npm run typecheck temiz', 'npm run smoke · 26/26'],
    ask: { at: 4, q: 'İzin istiyor: Bash · npm run build:levels', btn: 'İzin ver' },
    finalNote: 'Beyin doğruladı: smoke 26/26, tür denetimi temiz.' },
  { short: 'Faz 6 · Ses', full: 'Faz 6: Ses (ortam sesleri, dövüş efektleri)', state: 'öneri', g: 0.18, done: 0, total: 5, turns: 0,
    last: 'Beyin öneriyor: ses katmanı dünyadan bağımsız, ayrı bir kolda paralel yürüyebilir.',
    acts: ['audio/README.md okundu', 'audio/ortam.ts yazıldı', 'combat/vurus.ts düzenlendi', 'npm run smoke geçti', 'Ses seviyeleri dengelendi'] },
];
const PRESETS = [
  { short: 'Faz 7 · Kayıt', full: 'Faz 7: Kaydetme ve yükleme', total: 4,
    acts: ['save/format.md okundu', 'save/kayit.ts yazıldı', 'ui/menu.ts düzenlendi', 'npm test geçti'],
    ask: { at: 2, q: 'Soru soruyor: kayıt dosyası yerelde mi dursun, bulutta mı?', btn: 'Yanıtla: yerel' } },
  { short: 'Faz 8 · Performans', full: 'Faz 8: Gece sahnesinde kare süresi', total: 5,
    acts: ['Gece sahnesi ölçüldü', 'render/golge.ts düzenlendi', 'world/isikIzleri.ts düzenlendi', 'perf:night koşuldu', 'Kare süresi 21 → 14 ms'] },
  { short: 'Testler', full: 'Uçtan uca test kapsamı', total: 6,
    acts: ['tests/smoke.ts okundu', 'tests/dunya.spec.ts yazıldı', 'tests/kayit.spec.ts yazıldı', 'npm test koşuldu', 'tests/arena.spec.ts düzenlendi', 'npm test yeşil'] },
];

let uid = 0, arms = [], pulses = [], debris = [], sparks = [], inkP = [];
let sel = 'head', note = null, headMeta = null, metaT = 0;
let ctx = 0.64, ctxAnim = null, inking = false, compactions = 0, cutCount = 0, headFlash = 0, bob = 0;
let blinkT = 2.5, blinkK = -1;
const live = () => arms.filter((a) => !a.cutting);

function addArm(o) {
  const a = Object.assign({ id: ++uid, g: 1, done: 0, total: 5, turns: 0, acts: [], ph: Math.random() * 6.28,
    next: 4 + Math.random() * 2, pulseT: 1 + Math.random() * 2, glowOp: 0, tipFlash: 0, lblOp: 0, hover: false }, o);
  a.grad = el('linearGradient', { id: 'oc-ag' + a.id, gradientUnits: 'userSpaceOnUse' }, defs);
  a.stops = [0, 0.55, 1].map((x) => el('stop', { offset: x }, a.grad));
  a.gEl = el('g', null, gArms);
  a.ghost = el('path', { fill: 'none', stroke: COL.accent, 'stroke-width': 1.4, 'stroke-dasharray': '2 6', 'stroke-linecap': 'round', opacity: 0 }, a.gEl);
  a.glow = el('circle', { r: 11, fill: COL.accent, opacity: 0, filter: 'url(#oc-b6)' }, a.gEl);
  a.body = el('path', { fill: 'url(#oc-ag' + a.id + ')' }, a.gEl);
  a.edge = el('path', { fill: 'none', stroke: COL.text, 'stroke-width': 1, opacity: 0 }, a.gEl);
  a.gSuck = el('g', null, a.gEl);
  a.sc = Array.from({ length: a.total }, () => el('circle', { r: 1.5 }, a.gSuck));
  a.ring = el('circle', { fill: 'none', stroke: '#fff3ea', 'stroke-width': 1, opacity: 0 }, a.gSuck);
  a.hit = el('path', { class: 'hit', fill: 'none', stroke: 'transparent', 'stroke-width': 20, 'stroke-linecap': 'round', 'pointer-events': 'stroke' }, a.gEl);
  a.lbl = el('g', { class: 'lbl' }, gLbl);
  a.lblBg = el('rect', { rx: 7, fill: COL.bg3, stroke: COL.line, opacity: 0 }, a.lbl);
  a.tN = el('text', { class: 'n', 'text-anchor': 'middle', y: 0 }, a.lbl);
  a.tS = el('text', { class: 's', 'text-anchor': 'middle', y: 14 }, a.lbl);
  const pick = (e) => { e.stopPropagation(); select(a.id); };
  for (const x of [a.hit, a.body, a.lbl]) {
    x.addEventListener('click', pick);
    x.addEventListener('mouseenter', () => { a.hover = true; });
    x.addEventListener('mouseleave', () => { a.hover = false; });
  }
  const m = MOTION[a.state];
  Object.assign(a, { amp: m.amp, freq: m.freq, k: m.k, curlNow: m.curl, lift: m.lift });
  arms.push(a);
  layout();
  paint(a);
  setLabel(a);
  return a;
}

function removeArm(a) {
  a.gEl.remove(); a.lbl.remove(); a.grad.remove();
  arms = arms.filter((x) => x !== a);
  layout();
  if (sel === 'head') renderInfo();
}

// Kollar başın altından yelpaze gibi açılır; sayı değişince yerlerine kayarlar
function layout() {
  const L = live(), n = L.length;
  const spread = Math.min(70, 18 * n);
  root.classList.toggle('dense', n >= 7);
  L.forEach((a, i) => {
    const f = n === 1 ? 0.5 : i / (n - 1);
    const phi = (90 + spread - 2 * spread * f) * Math.PI / 180;
    a.Tt = { x: HX + 285 * Math.cos(phi), y: 172 + 236 * Math.sin(phi) };
    a.Bt = { x: HX + (n === 1 ? 0 : (f - 0.5) * 2 * Math.min(34, 7 * n)), y: 176 + 6 * (1 - Math.abs(f - 0.5) * 2) };
    if (!a.T) { a.T = { ...a.Tt }; a.B = { ...a.Bt }; }
  });
  bGrow.disabled = n >= MAX_ARMS || !PRESETS.length;
  bGrow.title = n >= MAX_ARMS ? 'Ahtapotun sekiz kolu var' : '';
}

function paint(a) {
  const s = a.state === 'bitti' ? STOPS.rest : a.state === 'bekliyor' ? STOPS.wait : STOPS.base;
  a.stops.forEach((st, i) => st.setAttribute('stop-color', s[i]));
  a.glow.setAttribute('fill', a.state === 'bekliyor' ? COL.warn : a.state === 'çalışıyor' || a.state === 'büyüyor' ? COL.accent : '#fff2e8');
}

function setLabel(a) {
  a.tN.textContent = (a.state === 'öneri' ? 'Öneri · ' : '') + a.short;
  a.tN.setAttribute('fill', a.state === 'öneri' ? COL.muted : COL.text);
  const counted = a.state === 'çalışıyor' || a.state === 'bitti';
  a.tS.textContent = STATE_NAME[a.state] + (counted ? ` · ${a.done}/${a.total}` : '');
  a.tS.setAttribute('fill', STATE_COL[a.state] || COL.muted);
}

function setState(a, s) {
  a.state = s;
  paint(a); setLabel(a);
  if (sel === a.id || sel === 'head') renderInfo();
}

function normals(pts) {
  for (let j = 0; j < pts.length; j++) {
    const p = pts[Math.max(0, j - 1)], q = pts[Math.min(pts.length - 1, j + 1)];
    const tx = q.x - p.x, ty = q.y - p.y, l = Math.hypot(tx, ty) || 1;
    pts[j].nx = -ty / l; pts[j].ny = tx / l;
  }
}

// Kolun orta çizgisi: kübik eğri + uca doğru büyüyen dalga + uçta kıvrım
function geom(a, gOv) {
  const ghost = gOv != null, g = ghost ? gOv : a.g;
  const B = { x: a.B.x, y: a.B.y + bob }, T = { x: a.T.x, y: a.T.y - 32 * a.lift };
  const dx = T.x - B.x;
  const w = clamp(Math.abs(a.T.x - HX) / 285, 0, 1);
  const side = Math.sign(a.T.x - HX) || (a.id % 2 ? 1 : -1);
  const c1x = B.x + dx * 0.1 + side * 14 * (1 - w), c1y = B.y + 70 + 30 * (1 - w);
  const c2x = T.x - dx * 0.35 * w - 25 * side * (1 - w), c2y = T.y + 45 * w - 70 * (1 - w);
  let pts = [];
  for (let j = 0; j <= N; j++) {
    const s = g * j / N, u = 1 - s;
    const b0 = u * u * u, b1 = 3 * u * u * s, b2 = 3 * u * s * s, b3 = s * s * s;
    pts.push({ x: b0 * B.x + b1 * c1x + b2 * c2x + b3 * T.x, y: b0 * B.y + b1 * c1y + b2 * c2y + b3 * T.y, s });
  }
  normals(pts);
  const amp = ghost ? 2 : a.amp;
  for (const p of pts) {
    const off = amp * Math.pow(p.s, 1.25) * Math.sin(2 * Math.PI * a.k * p.s - a.ph);
    p.x += p.nx * off; p.y += p.ny * off;
  }
  const cAmt = (ghost ? 0.2 : a.curlNow) * -side;
  if (Math.abs(cAmt) > 0.01) {
    const m = Math.round(N * 0.6);
    const out = pts.slice(0, m + 1).map((p) => ({ x: p.x, y: p.y, s: p.s }));
    let px = pts[m].x, py = pts[m].y;
    for (let j = m + 1; j <= N; j++) {
      const k = (j - m) / (N - m), th = cAmt * k * k;
      const vx = pts[j].x - pts[j - 1].x, vy = pts[j].y - pts[j - 1].y;
      const c = Math.cos(th), sn = Math.sin(th);
      px += vx * c - vy * sn; py += vx * sn + vy * c;
      out.push({ x: px, y: py, s: pts[j].s });
    }
    pts = out;
  }
  normals(pts);
  return { pts, curlSign: Math.sign(cAmt) || 1 };
}

function outline(pts, g) {
  const sc = 0.45 + 0.55 * clamp(g, 0, 1);
  const L = [], R = [];
  for (let j = 0; j < pts.length; j++) {
    const p = pts[j], u = j / (pts.length - 1);
    const w = (0.7 + 13.5 * Math.pow(1 - u, 1.15)) * sc;
    p.w = w;
    L.push(f1(p.x + p.nx * w / 2) + ' ' + f1(p.y + p.ny * w / 2));

function stepArm(a, dt, t) {

// Sahte iş akışı: görev biter, vantuz yanar, rapor kolun içinden beyne akar
function work(a, dt) {
  if (a.state !== 'çalışıyor') return;
  a.pulseT -= dt;
  if (a.pulseT <= 0) { pulse(a, 'up', 0.6); a.pulseT = 2.4 + Math.random() * 1.8; }
  a.next -= dt;
  if (a.next > 0) return;
  a.done = Math.min(a.total, a.done + 1);
  a.turns++;
  a.last = a.acts[(a.done - 1) % Math.max(1, a.acts.length)] || a.last;
  a.next = 4.5 + Math.random() * 2.5;
  pulse(a, 'up', 1);
  if (a.ask && !a.asked && a.done >= a.ask.at) {
    a.asked = true;
    setState(a, 'bekliyor');
    if (sel === 'head') select(a.id);
    return;
  }
  if (a.done >= a.total) {
    setState(a, 'rapor');
    pulse(a, 'up', 1.5, () => {
      if (a.cutting) return;
      headFlash = 1;
      setState(a, 'doğrulanıyor');
      setTimeout(() => {
        if (a.cutting) return;
        a.last = a.finalNote || 'Beyin doğruladı: iş tamam, testler yeşil.';
        setState(a, 'bitti');
      }, 1700);
    });
    return;
  }
  setLabel(a);
  if (sel === a.id) renderInfo();
}

  const c = el('circle', { r: 2.6 * size, fill: up ? '#fff0e6' : '#ffffff' }, gPulse);

}
function stepPulses(dt) {

    q.p += (q.up ? -1 : 1) * dt / (q.up ? 1.5 : 1.1);

  });
}

function stepHead(dt, t) {
  bob = REDUCE ? 0 : 2.2 * Math.sin(t * 1.25);
  gHead.setAttribute('transform', `translate(0 ${f1(bob)})`);
  if (ctxAnim) {
    ctxAnim.t += dt / 1.2;
    if (ctxAnim.t > 0) ctx = lerp(ctxAnim.from, ctxAnim.to, ease(ctxAnim.t));
    if (ctxAnim.t >= 1) ctxAnim = null;
  } else {
    ctx = Math.min(1, ctx + dt * 0.0006);
    if (ctx >= 0.92) ink(true);
  }

  fillP.setAttribute('d', top + 'L424 200L276 200Z');
  fillL.setAttribute('d', top);
  fillP.setAttribute('fill', ctx > 0.85 ? '#ffd9a8' : '#ffe4d6');
  tCtx.textContent = '%' + Math.round(ctx * 100);

  }

    p.el.setAttribute('cx', f1(p.x + 6 * Math.sin(t * 0.4 + p.ph)));

let last = performance.now();

  const t = (now - t0) / 1000;
  stepPlank(dt, t);
  stepHead(dt, t);
  for (const a of arms.slice()) stepArm(a, dt, t);
  stepPulses(dt); stepDebris(dt); stepSparks(dt); stepInk(dt);
  metaT -= dt;
  if (metaT <= 0) {
    metaT = 0.4;
    updateMeta();
    if (sel === 'head' && note && note.until < now) { note = null; renderInfo(); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
